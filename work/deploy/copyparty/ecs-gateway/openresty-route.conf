# LiveRelay 云端 WebDAV 云盘（copyparty）—— 公网 3923 入口（OpenResty 网关）
# 实际部署：源文件 /srv/tttahzun/gateway/routes/liverelay-drive.conf，
#   安装到 /opt/1panel/apps/openresty/openresty/conf/conf.d/ 后 nginx -t && nginx -s reload
# 上游：127.0.0.1:13923（容器 liverelay-drive，1Panel 编排）
# WebDAV 全方法透传；大包不设上限、不落盘缓冲；Host 带端口透传（MOVE 的 Destination 依赖外部地址一致）
server {
    listen 3923;
    server_name _;

    access_log /www/sites/tttahzun/log/liverelay-drive-access.log main;
    error_log /www/sites/tttahzun/log/liverelay-drive-error.log;

    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    send_timeout 3600s;
    proxy_http_version 1.1;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;

    location / {
        proxy_pass http://127.0.0.1:13923;
    }
}
