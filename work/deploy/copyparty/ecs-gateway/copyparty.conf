# LiveRelay 云端 WebDAV 云盘 —— ECS 网关形态 copyparty 1:N 配置（密码已脱敏）
# 实际部署机上此文件位于 /opt/1panel/docker/compose/liverelay-drive/copyparty.conf（600），
# 内含真实密码；本副本仅作模板。
# 注意：注释的 # 前要有两个空格

[global]
  p: 3923
  no-robots
  # 网关（OpenResty，本机回环）传入 X-Forwarded-For；防爆破按真实客户端 IP 计数
  xff-src: 127.0.0.1
  # 根路径反代不配置 rp-loc（它只接受路径且仅用于子路径部署，填完整 URL 会拒绝启动）

[accounts]
  owner: CHANGE-ME-ADMIN-PASSWORD
  demo: CHANGE-ME-CUSTOMER-PASSWORD

[groups]
  admins: owner

[/]
  /data/root
  accs:
    A: owner

# ===== 客户模板：每新增一个客户，复制下面 6 行，把 demo 全部替换成客户名 =====
# 客户名建议只用小写字母和数字（会出现在他的连接网址里），并在宿主机上先建好目录：
#   mkdir -p /srv/tttahzun/data/liverelay-drive/users/<客户名>
# 再在 [accounts] 里加一行：  <客户名>: <密码>
[/demo]
  /data/users/demo
  accs:
    rwmd: demo
  flags:
    daw: 1
