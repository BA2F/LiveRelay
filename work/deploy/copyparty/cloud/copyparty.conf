# LiveRelay 云服务（1:N）copyparty 配置模板
# 部署步骤与说明见 ../README.md
# 注意：注释的 # 前要有两个空格

[global]
  p: 3923
  no-robots
  # 经反向代理（Caddy/nginx）接入时配置 xff-src：反代的来源地址，
  # 让 copyparty 拿到真实客户端 IP（密码防爆破按 IP 计数）
  # xff-src: 172.16.0.0/12
  # rp-loc 只把盘挂到子路径（如 http://host/drive/）时才需要，且只填路径本身；根路径反代不要配
  # rp-loc: /drive

[accounts]
  # 服务器主管理员，只用于管理面板，不接触客户文件
  owner: CHANGE-ME-ADMIN-PASSWORD

[groups]
  admins: owner

[/]
  # 根路径只给管理员，客户各访问自己的 /<用户名>/
  /data/root
  accs:
    A: owner

# ===== 客户模板：每新增一个客户，复制下面这 6 行，把 alice 全部替换成客户名 =====
# 客户名建议只用小写字母和数字（会出现在他的连接网址里），并在宿主机上先建好目录：
#   mkdir -p data/users/<客户名>
# 权限 rwmd = 读写/移动/删除；不给 a（管理位，看上传者 IP、重载配置只留给 owner）
[/alice]
  /data/users/alice
  accs:
    rwmd: alice
  flags:
    daw: 1
