# LiveRelay 云服务（1:N）：公网 HTTPS 的 WebDAV 云盘
# 启动：docker compose up -d      查看日志：docker compose logs -f
# 前置：一个指向本机的域名（Caddy 会自动申请证书），端口 80/443 可被外网访问
# 说明见 ../README.md

services:
  copyparty:
    # 本地验证所用版本；若拉取失败改成 copyparty/ac:latest
    image: copyparty/ac:1.20.25
    container_name: liverelay-drive
    restart: unless-stopped
    # 只绑本机，公网流量一律经 Caddy 出 HTTPS
    ports:
      - "127.0.0.1:3923:3923"
    environment:
      PRTY_CONFIG: /cfg/copyparty.conf
    volumes:
      - ./copyparty.conf:/cfg/copyparty.conf:ro
      - ./data:/data
    mem_limit: 512m

  caddy:
    image: caddy:2
    container_name: liverelay-drive-tls
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 256m

volumes:
  caddy_data:
  caddy_config:
