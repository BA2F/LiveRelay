[project]
name = "diceware-cn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tan-win", email = "tanhaozun@outlook.com" }
]
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.2.2",
    "pyinstaller>=6.18.0",
]

[tool.setuptools.package-data]
"diceware_cn.data" = ["*.wordlist"]

[project.scripts]
diceware-cn = "diceware_cn.cli:main"
diceware-cn-gui = "diceware_cn.gui:main"

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"
